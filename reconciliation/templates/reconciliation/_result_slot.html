<div id="result-slot-{{ pharmacy.id }}" class="result-slot" hx-swap-oob="true">
    {% if error %}
        {% include 'reconciliation/_result_card.html' with pharmacy=pharmacy reconciliation=reconciliation error=error result=None %}

        {% include 'reconciliation/_result_card.html' with pharmacy=pharmacy reconciliation=reconciliation error=None result=result %}
    {% endif %}
</div>
