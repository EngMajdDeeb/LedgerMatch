{% load reconciliation_extras %}
<div x-data="{ dragging: false }" class="dropzone-wrap">
    <input
        type="file"
        name="{{ field_name }}"
        accept="{{ accept }}"
        x-ref="fileInput"
        style="display:none"
        hx-post="{% url url_name pharmacy.id view_date|date:'Y-m-d' %}"
        hx-target="#pharmacy-card-{{ pharmacy.id }}"
        hx-swap="outerHTML"
        hx-encoding="multipart/form-data"
        hx-trigger="change"
        hx-indicator="#uploading-{{ field_name }}-{{ pharmacy.id }}"
    >
    <label
        @click.prevent="$refs.fileInput.click()"
        @dragover.prevent="dragging = true"
        @dragleave.prevent="dragging = false"
        @drop.prevent="dragging = false; $refs.fileInput.files = $event.dataTransfer.files; $refs.fileInput.dispatchEvent(new Event('change', { bubbles: true }))"
        :class="{ dragging: dragging }"
        class="dropzone"
    >
        {% if file_field %}
            {% if file_field|is_image_ext %}
                <img src="{{ file_field.url }}" alt="معاينة الصورة" class="dropzone-thumb">
            {% else %}
                <svg class="filled-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            {% endif %}
            <span class="dropzone-text">{{ uploaded_label }}</span>
            <span class="dropzone-sub uploaded">اضغط لاستبدال الملف</span>
        {% else %}
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" /></svg>
            <span class="dropzone-text">{{ placeholder_text }}</span>
            <span class="dropzone-sub">اسحب وأفلت أو اضغط للاختيار</span>
        {% endif %}
    </label>
    <div id="uploading-{{ field_name }}-{{ pharmacy.id }}" class="dropzone-loading">
        <span class="spinner"></span>
    </div>
</div>
